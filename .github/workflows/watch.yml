name: watch a show

# GitHub throttles frequent schedules hard. A cron of */5 fired 57 minutes
# apart on the night this was written, which is most of a set -- so a schedule
# cannot be the thing that polls. It can only be the thing that *starts* a
# poller.
#
# So this workflow is one resident job. It wakes, asks whether a show is inside
# its watch window, and if so stays alive polling every five minutes until the
# show settles or the window closes. The schedule below is a restarter rather
# than a poller: it only has to land inside the window once.
#
# The ordinary workflow is untouched and keeps doing the thorough, expensive
# things on its own cadence. This one does exactly one job, so a mistake here
# cannot stop shows being archived.

on:
  workflow_dispatch:
  schedule:
    # Four tries an hour across the window a show can be running, at minutes
    # nobody else asks for. Only one of these has to actually fire for the
    # night to be covered, because the run it starts stays up.
    #
    # It used to be "*/30", which fires only at :00 and :30 -- the two most
    # contended minutes on the whole platform, and the two GitHub is most
    # likely to drop. It never fired once: in the three hours after this
    # workflow landed, six of those boundaries passed and the scheduler
    # skipped every one, while the ordinary workflow's "*/5" in this same
    # repository got through four times. The header above already knew the
    # schedule was throttled; what it missed is that *which minutes* you ask
    # for decides whether you are throttled to nothing or merely to less.
    # So: odd minutes, off the boundary, and more than one chance an hour.
    - cron: "3,18,33,48 22-23,0-9 * * *"

permissions:
  contents: write
  # To dispatch its own successor. A shift that ends with the show still going
  # used to hope a cron landed; measured over five days this cron fires 13% of
  # the time it is scheduled to, so that hope is worth about one chance in
  # eight per quarter hour. A dispatch is not scheduled and is not throttled.
  actions: write

# Its own group, so a long watch does not block the ordinary run from
# archiving, and a second watcher does not start on top of a live one.
concurrency:
  group: possumlogic-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Below the 6h job ceiling with room to spare. A show plus its settling
    # period is about six hours; if this ends first, the next schedule restarts
    # it and no data is lost, because everything is written to the archive as
    # it arrives rather than at the end.
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --lead 30 so the shift is already up when the first song is posted. The
      # window opens half an hour before that typically happens, and on the
      # three show nights measured this job started 6, 10 and 14 minutes into
      # it -- margin that came from luck, not design, on a cron that fires 13%
      # of the time. Thirty minutes early costs half an hour of runner time and
      # is the difference between covering a show's opening and missing it.
      #
      # `grep` before `cut`, because --watching now prints two lines. Piping
      # the whole output through `cut -d= -f2` yields "false\nfalse", which is
      # never equal to "true" -- the gate would fail closed and this workflow
      # would silently never run again.
      - name: Is a show playing?
        id: gate
        run: |
          out=$(python possumlogic.py --site site --watching --lead 30)
          echo "$out"
          watching=$(echo "$out" | grep '^watching=' | cut -d= -f2)
          echo "watching=$watching" >> "$GITHUB_OUTPUT"

      # Arm for tonight, whatever this run was for. These crons land about
      # four times a day and hours late, so the one that lands at 19:50 is
      # the one that has to cover a 23:00 window -- see arm.yml.
      - name: Arm a watcher for the next window
        if: steps.gate.outputs.watching != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(python possumlogic.py --site site --watching --lead 30)
          opens=$(echo "$out" | grep '^opens_in=' | cut -d= -f2)
          if [ -z "$opens" ] || [ "$opens" -eq 0 ] || [ "$opens" -gt 720 ]; then
            echo "nothing to arm (opens_in=$opens)"
            exit 0
          fi
          up=$(gh run list --workflow arm.yml --json status \
                 --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' \
                 2>/dev/null || echo 0)
          if [ "$up" = "0" ]; then
            echo "window opens in $opens min -- dispatching arm.yml"
            gh workflow run arm.yml --ref "$GITHUB_REF_NAME"
          else
            echo "window opens in $opens min; already armed"
          fi

      - name: Install what the preview cards need
        if: steps.gate.outputs.watching == 'true'
        run: python -m pip install --quiet pillow

      - name: Restore the published preview cards
        if: steps.gate.outputs.watching == 'true'
        run: |
          git fetch --depth=1 origin gh-pages || exit 0
          mkdir -p site/card
          git archive origin/gh-pages card 2>/dev/null | tar -x -C site || true

      - name: Follow the show
        if: steps.gate.outputs.watching == 'true'
        env:
          PL_PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}
          PL_GOATCOUNTER: ${{ vars.PL_GOATCOUNTER }}
          PL_DOMAIN: ${{ vars.PL_DOMAIN }}
          # For the self-dispatch at the end of a shift.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          deadline=$(( $(date +%s) + 300*60 ))
          pass=0
          while :; do
            pass=$(( pass + 1 ))
            echo "::group::pass $pass"

            # Track main before building. This job checks the repository out
            # once and then lives for up to five hours, rebuilding and
            # republishing the *whole site* every pass -- so without this it
            # publishes from the code it started with, and any change pushed
            # during a show is reverted on the live site every five minutes
            # until the job exits. Tonight it flip-flopped the published site
            # against the ordinary workflow for forty minutes: watcher passes
            # put the old build back, pushes put the new one up again.
            #
            # There is a pull further down, but only inside the branch that
            # runs when site/data changed -- so once a show settles and no new
            # songs arrive, the watcher stops tracking main entirely, which is
            # exactly when it is still publishing every five minutes.
            if ! git pull --rebase -q origin main; then
              echo "rebase conflicted on pull; aborting, building from the tree as-is"
              git rebase --abort || true
            fi
            # Two days is enough: this only ever runs during a show.
            # --calendar matters more here than it looks. A show only counts
            # as a concert if the counting calendar holds its date, and the
            # calendar is built from phish.net's show list -- so a show played
            # tonight is not in it until something asks. Without this the show
            # being played lands under "Also on file" instead of at the top of
            # the index, on the one night it is worth looking at. One call.
            python possumlogic.py --site site --previous --rebuild \
              --catch-up 2 --calendar || true

            # The archive first, so a crash after this point still leaves the
            # data recorded and only costs a publish. This also carries the
            # running order, which --catch-up writes for any show it fetches
            # that has settled -- during a show that is nothing, which is
            # correct, and the pass after it settles is the one that records it.
            git add site/data
            if ! git diff --cached --quiet; then
              git commit -q -m "Archive gap reports for new shows"
              # A rebase that conflicts must not be left half-applied. It used
              # to be `|| true`, which swallowed the failure and left conflict
              # markers inside site/data/shows/<date>.json -- and a report with
              # markers in it is unreadable JSON, so the show was dropped from
              # the archive and every following pass published a site without
              # the show it was watching. Abort, keep this pass's work, and
              # try again in five minutes; the archive is re-fetched each pass
              # so nothing is lost by not pushing now.
              if ! git pull --rebase -q origin main; then
                echo "rebase conflicted; aborting and retrying next pass"
                git rebase --abort || true
              else
                git push -q origin main || echo "push rejected; retrying next pass"
              fi
              # Whatever happened above, the tree must be clean before the
              # site is built from it.
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "tree dirty after rebase; resetting to HEAD"
                git checkout -- . || true
              fi
            fi

            # Publish onto whatever is on the remote right now, not onto
            # whatever this checkout last saw -- the ordinary workflow may have
            # published in between.
            git fetch -q origin gh-pages
            rm -rf ../pages
            git worktree add -q --detach ../pages origin/gh-pages
            find ../pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
            cp -R site/. ../pages/
            ( cd ../pages
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "Publish $(date -u +%FT%TZ)"
                git push -q origin HEAD:gh-pages && echo "published"
              else
                echo "nothing changed"
              fi )
            git worktree remove --force ../pages
            echo "::endgroup::"

            # Stop when the show has settled, when it is out of its window, or
            # when the shift is over.
            #
            # Stillness is the one that matters and it was missing. The loop
            # only ever asked whether the window was open, and the window is
            # 7h30m -- 19:00 to 02:30 local -- so a show that ended at midnight
            # held a runner until half past two.
            #
            # `released` is not the page's `provisional`. settle() lets the
            # page go half an hour after an encore is recorded, which is right
            # for a label the next pass can take back and wrong for the
            # watcher, whose leaving is what stops the next pass. Six and seven
            # song encores exist and run close to an hour; songs arriving keep
            # resetting the clock, but phish.net posting the first one and then
            # straggling past half an hour is ordinary. So this holds for the
            # full two hours of stillness regardless of the encore shortcut.
            # Still exits hours before the window closes.
            out=$(python possumlogic.py --site site --watching --lead 30)
            still=$(echo "$out" | grep '^watching=' | cut -d= -f2)
            done_=$(echo "$out" | grep '^released=' | cut -d= -f2)
            if [ "$done_" = "true" ]; then
              echo "show still for two hours; stopping"
              break
            fi
            if [ "$still" != "true" ]; then
              echo "window closed; stopping"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # Hand off deliberately rather than hoping. The concurrency group
              # serialises this workflow, so a run dispatched now sits pending
              # and starts the instant this one exits -- measured at a three
              # second gap on 2026-07-29, when a cron happened to have queued
              # one. This makes that handoff happen every time instead of only
              # when the scheduler obliges.
              echo "shift over; dispatching the next one"
              gh workflow run watch.yml --ref "$GITHUB_REF_NAME" \
                || echo "dispatch failed; falling back to the cron"
              break
            fi
            sleep 300
          done
